name: Deploy Pages (prod + staging + loaders)

on:
  push:
    branches: ["main", "staging"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (prod source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo-main

      - name: Checkout staging (staging source)
        uses: actions/checkout@v4
        with:
          ref: staging
          path: repo-staging

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            repo-main/package-lock.json
            repo-staging/package-lock.json

      - name: Build prod from main
        working-directory: repo-main
        run: |
          npm ci
          # Ensure Parcel watcher native binary exists on Ubuntu runners
          npm i --no-save @parcel/watcher-linux-x64-glibc

          # Fail fast if drop-params.json is stale vs drop-params.js (MAIN)
          npm run dropparams:json
          if ! git diff --quiet -- shared/drop-params/drop-params.json; then
            echo "::error title=DROP PARAMS JSON MISMATCH (MAIN)::shared/drop-params/drop-params.json is stale vs shared/drop-params/drop-params.js. Run 'npm run dropparams:json' locally and commit the updated JSON."
            echo ""
            echo "=== Diff (expected: no changes) ==="
            git diff -- shared/drop-params/drop-params.json
            echo ""
            exit 1
          fi

          npm run build:pages:prod -- --no-optimize

      - name: Build staging from staging
        working-directory: repo-staging
        run: |
          npm ci
          # Ensure Parcel watcher native binary exists on Ubuntu runners
          npm i --no-save @parcel/watcher-linux-x64-glibc

          # Fail fast if drop-params.json is stale vs drop-params.js (STAGING)
          npm run dropparams:json
          if ! git diff --quiet -- shared/drop-params/drop-params.json; then
            echo "::error title=DROP PARAMS JSON MISMATCH (STAGING)::shared/drop-params/drop-params.json is stale vs shared/drop-params/drop-params.js. Run 'npm run dropparams:json' locally and commit the updated JSON."
            echo ""
            echo "=== Diff (expected: no changes) ==="
            git diff -- shared/drop-params/drop-params.json
            echo ""
            exit 1
          fi

          npm run build:pages:staging -- --no-optimize

      - name: Assemble dist for Pages
        run: |
          main_root_count=0
          for source in home drops exchange; do
            if [[ -f "repo-main/loaders/root/${source}.js" ]]; then
              main_root_count=$((main_root_count + 1))
            fi
          done

          if [[ "$main_root_count" -ne 3 ]]; then
            echo "::error title=PERMANENT ROOT ROUTERS REQUIRED::main must contain all three permanent root routers: loaders/root/home.js, loaders/root/drops.js, and loaders/root/exchange.js (found ${main_root_count} of 3)."
            exit 1
          fi

          mkdir -p dist/prod dist/staging
          cp -R repo-main/dist/prod/* dist/prod/ || true
          cp -R repo-staging/dist/staging/* dist/staging/ || true

          # Stable root routers and prod environment loaders are main-owned.
          cp repo-main/loaders/root/home.js dist/home.js
          cp repo-main/loaders/root/drops.js dist/drops.js
          cp repo-main/loaders/root/exchange.js dist/exchange.js
          cp repo-main/loaders/environment/home.js dist/prod/home-loader.js
          cp repo-main/loaders/environment/drops.js dist/prod/drops-loader.js
          cp repo-main/loaders/environment/exchange.js dist/prod/exchange-loader.js

          # Staging environment loaders are always staging-owned.
          cp repo-staging/loaders/environment/home.js dist/staging/home-loader.js
          cp repo-staging/loaders/environment/drops.js dist/staging/drops-loader.js
          cp repo-staging/loaders/environment/exchange.js dist/staging/exchange-loader.js

      - name: Verify Pages loader graph and provenance
        run: node repo-staging/scripts/verify-pages-loader-artifacts.mjs dist repo-main repo-staging

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
